name: Deploy to Hugging Face Space

on:
  push:
    branches: [main]
  workflow_dispatch: {}   # lets you trigger a redeploy manually from the Actions tab

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history — HF's git remote needs a real history, not a shallow clone

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          # Set these two repo secrets/variables in GitHub:
          #   Settings -> Secrets and variables -> Actions
          HF_USERNAME: ${{ secrets.HF_USERNAME }}
          HF_SPACE_NAME: ${{ secrets.HF_SPACE_NAME }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add space "https://${HF_USERNAME}:${HF_TOKEN}@huggingface.co/spaces/${HF_USERNAME}/${HF_SPACE_NAME}"
          # Force-push main -> HF Space's main branch. HF rebuilds the
          # Docker image from this content on receipt, same as your
          # AnythingLLM Space's deploy.
          git push --force space HEAD:main
